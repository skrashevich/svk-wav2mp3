name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CCGO_FLAGS: >-
    --package-name lame
    -DHAVE_CONFIG_H
    -DNOANALYSIS -DLAME_LIBRARY_BUILD -DSTDC_HEADERS -DHAVE_STDINT_H
    -ignore-asm-errors -ignore-unsupported-alignment
  LAME_SRCS: >-
    VbrTag.c bitstream.c encoder.c fft.c gain_analysis.c id3tag.c lame.c
    mpglib_interface.c newmdct.c presets.c psymodel.c quantize.c
    quantize_pvt.c reservoir.c set_get.c tables.c takehiro.c util.c
    vbrquantize.c version.c

jobs:
  generate-amd64:
    name: Generate amd64 transpiled files
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install ccgo
        run: go install modernc.org/ccgo/v4@latest

      - name: Download and configure LAME
        run: |
          cd /tmp
          curl -sL https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz | tar xz
          cd lame-3.100
          ./configure --disable-shared --disable-frontend --disable-decoder \
            --disable-gtktest --enable-static --disable-rpath --disable-cpml \
            CFLAGS="-O2 -fno-strict-aliasing"

      - name: Generate darwin/amd64 (native)
        run: |
          LAME=/tmp/lame-3.100
          SRCS=$(echo $LAME_SRCS | tr ' ' '\n' | sed "s|^|${LAME}/libmp3lame/|" | tr '\n' ' ')
          ccgo $CCGO_FLAGS \
            -I${LAME}/include -I${LAME}/libmp3lame -I${LAME} \
            -o internal/lame/lame_darwin_amd64.go \
            $SRCS

      - name: Generate linux/amd64 (cross-OS)
        run: |
          LAME=/tmp/lame-3.100
          SRCS=$(echo $LAME_SRCS | tr ' ' '\n' | sed "s|^|${LAME}/libmp3lame/|" | tr '\n' ' ')
          TARGET_GOOS=linux TARGET_GOARCH=amd64 \
          ccgo $CCGO_FLAGS \
            -I${LAME}/include -I${LAME}/libmp3lame -I${LAME} \
            -o internal/lame/lame_linux_amd64.go \
            $SRCS

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: lame-amd64
          path: |
            internal/lame/lame_linux_amd64.go
            internal/lame/lame_darwin_amd64.go

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: generate-amd64
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download amd64 transpiled files
        uses: actions/download-artifact@v4
        with:
          name: lame-amd64
          path: .

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          OUTPUT=wav2mp3-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}
          go build -ldflags "-X main.version=${VERSION}" -o ${OUTPUT} ./cmd/wav2mp3
          chmod +x ${OUTPUT}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wav2mp3-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wav2mp3-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: wav2mp3-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la wav2mp3-*
          gh release create ${GITHUB_REF_NAME} wav2mp3-* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
